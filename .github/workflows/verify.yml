name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run release
      - uses: actions/upload-artifact@v7
        with:
          name: yibuyibei-release
          path: |
            release/yibuyibei-source.tar.gz
            release/yibuyibei-site.tar.gz
          if-no-files-found: error

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm exec vite build --base='${{ steps.pages.outputs.base_path }}/' --outDir dist-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - uses: actions/deploy-pages@v4
        id: deployment
